dataset:
  name: "m5_forecasting_accuracy"
  source: "kaggle"

paths:
  raw_dir: "data/raw/m5"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

files:
  calendar: "calendar.csv"
  prices: "sell_prices.csv"
  sales: "sales_train_validation.csv"

forecast:
  grain:
    - "item_id"
    - "store_id"
    - "date"
  target: "unit_sales"
  primary_horizon_days: 7

validation:
  allow_negative_demand: false
