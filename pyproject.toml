[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demandpilot"
version = "0.1.0"
description = "Probabilistic retail demand forecasting and inventory intelligence platform."
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5,<5",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pyarrow>=18,<26",
    "PyYAML>=6,<7",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
